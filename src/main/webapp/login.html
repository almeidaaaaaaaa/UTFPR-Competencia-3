<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meninas Digitais · UTFPR</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="shell">
    <div class="left">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div>
          <div class="logo-brand">Meninas Digitais</div>
          <div class="logo-sub">UTFPR · Campus Cornélio Procópio</div>
        </div>
      </div>
      <div class="headline">
        <h1>Bem-vinda de <em>volta!</em></h1>
        <p>Acesse sua conta para visualizar e enviar sugestões aos projetos de extensão.</p>
      </div>
      <div class="badges">
        <span class="badge">Meninas Digitais</span>
        <span class="badge">UTFPR Conecta</span>
        <span class="badge">Code for All</span>
      </div>
    </div>

    <div class="right">
      <div class="title">Entrar</div>
      <div class="sub">Informe seus dados para acessar o sistema.</div>

      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" />
      </div>

      <button class="btn-primary" onclick="entrar()">Entrar</button>
      <div class="result" id="result"></div>

      <div class="link-bottom">
        Não tem conta? <a href="index.html">Cadastre-se</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
